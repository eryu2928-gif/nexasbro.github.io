<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12112b">
  <meta name="referrer" content="no-referrer">
  <script> const config_username = "@nexasbro"; </script>
  <script> const config_fullname = "Nexas Bro"; </script>
  <script> const config_profile_pic = "https://i.postimg.cc/gkQLQJVt/file-00000000558c8211b9fdb48491ef8926.png"; </script>
  <title id="page-title"></title>
  <link rel="icon" id="page-favicon" href="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    :root {
      --text: #f4f5fb;
      --muted: rgba(244, 245, 251, 0.62);
      --edge: rgba(255, 255, 255, 0.14);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #12112b; }

    body {
      font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(160deg, #12112b 0%, #1d1a4a 55%, #2a1d52 100%);
      background-attachment: fixed;
    }

    a { text-decoration: none; color: inherit; }
    ::selection { background: #7c8cff; color: #12112b; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 5px; }

    /* Soft colour behind the glass */
    .scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; }
    .o1 { width: 300px; height: 300px; background: #4f6bff; top: -90px; left: -100px; opacity: .38; animation: f1 20s ease-in-out infinite alternate; }
    .o2 { width: 280px; height: 280px; background: #a64dff; bottom: -90px; right: -110px; opacity: .30; animation: f2 24s ease-in-out infinite alternate; }
    @keyframes f1 { to { transform: translate(70px, 90px) scale(1.12); } }
    @keyframes f2 { to { transform: translate(-80px, -60px) scale(1.1); } }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 430px; margin: 0 auto;
      min-height: 100vh; padding: 28px 16px;
      display: flex; flex-direction: column; justify-content: center;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }

    /* Glass header */
    .profile-card {
      display: flex; align-items: center; gap: 18px;
      padding: 18px;
      border-radius: 28px;
      background: rgba(255,255,255,0.07);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      backdrop-filter: blur(22px) saturate(150%);
      border: 1px solid var(--edge);
      box-shadow: 0 20px 40px -24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.14);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .profile-logo-wrap {
      width: 88px; height: 88px; flex: none;
      padding: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
    }

    .profile-logo-img {
      width: 100%; height: 100%; display: block;
      object-fit: cover; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
    }

    .intro { min-width: 0; }

    .username {
      font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .hero-sub { margin-top: 5px; font-size: 0.95rem; font-weight: 500; line-height: 1.3; color: var(--muted); }

    /* Bento grid */
    .links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

    .social-btn {
      --brand: #8b9bff;
      --mx: 50%; --my: 50%;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      min-height: 118px; padding: 14px;
      border-radius: 24px;
      background: linear-gradient(150deg, color-mix(in srgb, var(--brand) 14%, rgba(255,255,255,0.06)), rgba(255,255,255,0.05));
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid var(--edge);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 14px 26px -20px rgba(0,0,0,0.7);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s, box-shadow 0.3s;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .social-btn:nth-child(1) { animation-delay: .10s; }
    .social-btn:nth-child(2) { animation-delay: .15s; }
    .social-btn:nth-child(3) { animation-delay: .20s; }
    .social-btn:nth-child(4) { animation-delay: .25s; }
    .social-btn:nth-child(5) { animation-delay: .30s; }
    .social-btn:nth-child(6) { animation-delay: .35s; }
    .social-btn:nth-child(7) { animation-delay: .40s; }
    .social-btn:nth-child(8) { animation-delay: .45s; }
    .social-btn:nth-child(9) { animation-delay: .50s; }

    .social-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(170px circle at var(--mx) var(--my), rgba(255,255,255,0.16), transparent 65%);
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }

    .social-btn:hover, .social-btn:focus-visible {
      transform: translateY(-3px);
      border-color: color-mix(in srgb, var(--brand) 60%, rgba(255,255,255,0.3));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 20px 34px -18px color-mix(in srgb, var(--brand) 70%, transparent);
      outline: none;
    }

    .social-btn:hover::after, .social-btn:focus-visible::after { opacity: 1; }
    .social-btn:active { transform: scale(0.98); }

    /* Logo tile: clean light glass so the brand-coloured logo reads clearly */
    .icon-box {
      position: relative; z-index: 1;
      width: 44px; height: 44px;
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 24px;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 6px 14px -6px rgba(0,0,0,0.5);
    }

    .platform-name {
      position: relative; z-index: 1;
      font-size: 1.08rem; font-weight: 600; letter-spacing: -0.01em;
    }

    .go-icon {
      position: absolute; z-index: 1; top: 14px; right: 14px;
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 14px; color: rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s, color 0.3s;
    }

    .social-btn:hover .go-icon, .social-btn:focus-visible .go-icon {
      transform: rotate(-45deg); background: #fff; color: #1d1a4a;
    }

    /* Wide first tile */
    .youtube { grid-column: 1 / -1; min-height: 100px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 14px; }
    .youtube .platform-name { font-size: 1.2rem; }

    /* Brand colours: tile tint + logo colour */
    .youtube   { --brand: #ff0000; }  .youtube .icon-box   { color: #ff0000; }
    .tiktok    { --brand: #25f4ee; }  .tiktok .icon-box    { color: #010101; text-shadow: 1.5px 1.5px 0 #fe2c55, -1.5px -1.5px 0 #25f4ee; }
    .facebook  { --brand: #1877f2; }  .facebook .icon-box  { color: #1877f2; }
    .instagram { --brand: #e1306c; }
    .instagram .icon-box i {
      background: linear-gradient(45deg, #feda75, #fa7e1e 30%, #d62976 60%, #962fbf 80%, #4f5bd5);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .whatsapp  { --brand: #25d366; }  .whatsapp .icon-box  { color: #25d366; }
    .discord   { --brand: #5865f2; }  .discord .icon-box   { color: #5865f2; }
    .telegram  { --brand: #229ed9; }  .telegram .icon-box  { color: #229ed9; }
    .twitter   { --brand: #9aa0b8; }  .twitter .icon-box   { color: #000; }
    .threads   { --brand: #9aa0b8; }  .threads .icon-box   { color: #000; }

    .footer {
      margin-top: 20px;
      font-size: 0.72rem; font-weight: 500; letter-spacing: 0.05em;
      color: var(--muted); text-align: center;
      animation: rise 0.7s 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .footer span { color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="scene"><div class="orb o1"></div><div class="orb o2"></div></div>

  <div class="wrap">

    <div class="profile-card">

      <div class="profile-logo-wrap">
        <img id="display-profile-pic" src="" alt="Profile" class="profile-logo-img">
      </div>

      <div class="intro">
        <p id="display-username" class="username">@devyasin</p>
        <p class="hero-sub">Welcome to my official links</p>
      </div>

    </div>

    <div class="links">

      <a href="https://youtube.com/@nexasbro?si=fcj4IhVeojRaB-dV" target="_blank" class="social-btn youtube">
        <div class="icon-box"><i class="ti ti-brand-youtube"></i></div>
        <span class="platform-name">YouTube</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="tiktok.com/@nexasbro" target="_blank" class="social-btn tiktok">
        <div class="icon-box"><i class="ti ti-brand-tiktok"></i></div>
        <span class="platform-name">TikTok</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://www.facebook.com/share/1FH6wD91LV/" target="_blank" class="social-btn facebook">
        <div class="icon-box"><i class="ti ti-brand-facebook"></i></div>
        <span class="platform-name">Facebook</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://instagram.com/" target="_blank" class="social-btn instagram">
        <div class="icon-box"><i class="ti ti-brand-instagram"></i></div>
        <span class="platform-name">Instagram</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://whatsapp.com/channel/0029Vb8pAAtHLHQREbdqvz2h" target="_blank" class="social-btn whatsapp">
        <div class="icon-box"><i class="ti ti-brand-whatsapp"></i></div>
        <span class="platform-name">WhatsApp</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://discord.com/" target="_blank" class="social-btn discord">
        <div class="icon-box"><i class="ti ti-brand-discord"></i></div>
        <span class="platform-name">Discord</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://t.me/nexasbro" target="_blank" class="social-btn telegram">
        <div class="icon-box"><i class="ti ti-brand-telegram"></i></div>
        <span class="platform-name">Telegram</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://x.com/" target="_blank" class="social-btn twitter">
        <div class="icon-box"><i class="ti ti-brand-x"></i></div>
        <span class="platform-name">Twitter (X)</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

      <a href="https://threads.net/" target="_blank" class="social-btn threads">
        <div class="icon-box"><i class="ti ti-brand-threads"></i></div>
        <span class="platform-name">Threads</span>
        <i class="ti ti-arrow-up-right go-icon"></i>
      </a>

    </div>

    <p class="footer">© 2026 <span id="display-fullname">DEV YASIN</span> · ALL RIGHTS RESERVED</p>
  </div>

  <script>
    // These lines automatically update the names on the website based on lines 8 and 9!
    document.getElementById('page-title').textContent = config_fullname.toUpperCase() + " | Bio Links";
    document.getElementById('display-username').textContent = config_username.toLowerCase();
    document.getElementById('display-fullname').textContent = config_fullname.toUpperCase();
    // This updates the profile picture based on line 10
    document.getElementById('display-profile-pic').src = config_profile_pic;

    // Pointer-following light on the glass tiles
    document.querySelectorAll('.social-btn').forEach(function (btn) {
      btn.addEventListener('pointermove', function (e) {
        var r = btn.getBoundingClientRect();
        btn.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        btn.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });

    // Automatically make the website logo (favicon) round!
    const faviconImg = new Image();
    faviconImg.crossOrigin = "Anonymous";
    faviconImg.onload = function() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(128, 128, 128, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(faviconImg, 0, 0, faviconImg.width, faviconImg.height, 0, 0, 256, 256);
      try {
        document.getElementById('page-favicon').href = canvas.toDataURL();
      } catch (e) {
        document.getElementById('page-favicon').href = config_profile_pic; // Fallback
      }
    };
    faviconImg.onerror = () => document.getElementById('page-favicon').href = config_profile_pic;
    faviconImg.src = config_profile_pic;
  </script>
</body>
</html>
